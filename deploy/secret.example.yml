# Plantilla del Secret. Copiar a secret.yml, rellenar y NO versionar.
# secret.yml esta en .gitignore.
#
# Se usa stringData (texto plano, k8s lo codifica solo).
# Si se usa "data:" los valores DEBEN ir en base64 o kubectl rechaza el manifiesto.
apiVersion: v1
kind: Secret
metadata:
  name: secret-sigapp-backend
  namespace: ns-sigapp-dev
type: Opaque
stringData:
  DB_TNS: "jdbc:oracle:thin:@//HOST:PUERTO/SERVICIO"
  DB_USERNAME: ""
  DB_PASSWORD: ""
  # Generar una distinta por ambiente:  openssl rand -base64 48
  JWT_SECRET: ""
