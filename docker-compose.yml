services:
  sigapp-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigapp-backend:local
    container_name: sigapp-backend
    ports:
      - "8082:8082"
    # Las credenciales viven en .env (gitignoreado), nunca en este archivo.
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
