spring.application.name=SigAPP

# Carga el .env de la raiz en ejecucion local (esta gitignoreado). Spring Boot no
# lo lee de forma nativa, por eso se importa como properties. En Docker/Kubernetes
# las variables inyectadas ganan sobre esto. "optional:" evita fallar si no existe.
spring.config.import=optional:file:.env[.properties]

# Configuracion de Oracle
spring.datasource.url=${DB_TNS}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
server.port=${SERVER_PORT:8082}

spring.datasource.hikari.max-lifetime=600000          
# Tiempo maximo que una conexion puede estar inactiva en el pool
spring.datasource.hikari.idle-timeout=300000          
# Hikari valida la conexion antes de entregarla al codigo
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.validation-timeout=3000      
# Keepalive Hikari envia un ping periodico para mantener vivas las conexiones
spring.datasource.hikari.keepalive-time=120000        
# Tamano del pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Configuracion de Hibernate / JPA}
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# db_* aporta la version cuando no hay conexion; con Oracle vivo gana el metadata JDBC.
spring.jpa.properties.hibernate.dialect.db_name=Oracle
spring.jpa.properties.hibernate.dialect.db_major_version=23
spring.jpa.properties.hibernate.dialect.db_minor_version=0
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Developer Mode
security.developer-mode=${SECURITY_DEVELOPER_MODE:true}
app.features.envio-correo=${APP_FEATURES_ENVIO_CORREO:false}

# JWT config
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:28800000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

# Traspasos
# Tope de la firma
app.traspasos.firma.max-bytes=${APP_TRASPASOS_FIRMA_MAX_BYTES:512000}

# Tope de articulos por traspaso.
app.traspasos.max-articulos=${APP_TRASPASOS_MAX_ARTICULOS:50}

# Requisiciones
# Tope de lineas por peticion. Cada linea es una llamada al paquete dentro de la misma transaccion:
app.requisiciones.max-lineas=${APP_REQUISICIONES_MAX_LINEAS:200}
# Ventana por defecto de la bandeja cuando no llega el parametro "desde".
app.requisiciones.dias-bandeja=${APP_REQUISICIONES_DIAS_BANDEJA:90}
# Tope de filas que devuelve la bandeja, por la misma razon.
app.requisiciones.max-bandeja=${APP_REQUISICIONES_MAX_BANDEJA:500}

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG

# Actuator - probes para Kubernetes
# Solo health e info expuestos: nada de env/beans/configprops que filtran configuracion.
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Liveness NO incluye la BD: un corte de Oracle no debe reiniciar el pod.
management.endpoint.health.group.liveness.include=livenessState
# Readiness SI incluye la BD: sin Oracle el pod sale de balanceo pero no se reinicia.
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=false

# Apagado ordenado: termina las peticiones en curso antes de morir (rolling updates)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s