spring.application.name=SigAPP

# Carga el .env de la raiz en ejecucion local (esta gitignoreado). Spring Boot no
# lo lee de forma nativa, por eso se importa como properties. En Docker/Kubernetes
# las variables inyectadas ganan sobre esto. "optional:" evita fallar si no existe.
spring.config.import=optional:file:.env[.properties]

# Configuracion de Oracle
# Sin default a proposito: las credenciales nunca se versionan. Si la variable no
# esta definida la app no arranca, en vez de caer contra la BD de desarrollo.
# Valores de local en .env (ver .env.example); en k8s en secret-sigapp-backend.
spring.datasource.url=${DB_TNS}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
server.port=${SERVER_PORT:8082}
# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.datasource.hikari.max-lifetime=600000          
# Tiempo máximo que una conexión puede estar inactiva en el pool
spring.datasource.hikari.idle-timeout=300000          
# Hikari valida la conexión antes de entregarla al código
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.validation-timeout=3000      
# Keepalive — Hikari envía un ping periódico para mantener vivas las conexiones
spring.datasource.hikari.keepalive-time=120000        
# Tamaño del pool — en dev no necesitas más de esto
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Configuracion de Hibernate / JPA
# Dialecto declarado explicitamente (Oracle 23ai). Sin esto Hibernate necesita
# conectarse a la BD durante el arranque para detectarlo, y si Oracle no responde
# el pod muere en CrashLoopBackOff en vez de quedar NotReady.
# El warning HHH90000025 ("no need to specify the dialect") es esperado: se declara
# a proposito para poder arrancar sin BD. Sin esta linea el arranque falla.
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# db_* aporta la version cuando no hay conexion; con Oracle vivo gana el metadata JDBC.
spring.jpa.properties.hibernate.dialect.db_name=Oracle
spring.jpa.properties.hibernate.dialect.db_major_version=23
spring.jpa.properties.hibernate.dialect.db_minor_version=0
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Developer Mode
# Sin default seguro: si no se define la variable, arranca CON seguridad activa.
security.developer-mode=${SECURITY_DEVELOPER_MODE:true}
app.features.envio-correo=${APP_FEATURES_ENVIO_CORREO:false}

# JWT config
# Sin default: la clave nunca se versiona. Generar una distinta por ambiente con
#   openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:28800000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG

# Actuator - probes para Kubernetes
# Solo health e info expuestos: nada de env/beans/configprops que filtran configuracion.
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Liveness NO incluye la BD: un corte de Oracle no debe reiniciar el pod.
management.endpoint.health.group.liveness.include=livenessState
# Readiness SI incluye la BD: sin Oracle el pod sale de balanceo pero no se reinicia.
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=false

# Apagado ordenado: termina las peticiones en curso antes de morir (rolling updates)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s